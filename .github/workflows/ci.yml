name: CI

# Corre en cada pull request hacia main y en lo que entre a main.
#
# Lo que verifica es exactamente lo que se verificaba a mano antes de cada
# commit: dominio, interfaz, análisis estático, build web, reglas de acceso y la
# huella de los documentos normativos. La diferencia es que ahora nadie puede
# olvidarse.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si se empuja dos veces seguidas a la misma rama, la primera ejecución se
# cancela: no sirve de nada verificar un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura. Ningún trabajo de este flujo escribe en el repositorio ni
# necesita secretos: las pruebas de reglas usan los emuladores con un
# identificador ficticio.
permissions:
  contents: read

env:
  VERSION_FLUTTER: 3.44.2

jobs:
  dominio:
    name: Dominio, interfaz y análisis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.VERSION_FLUTTER }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        # El proyecto exige que salga limpio: es el principio VII de la
        # constitución, simplicidad verificable.
        run: flutter analyze

      - name: Pruebas de dominio, datos e interfaz
        run: flutter test

      - name: Frontera del dominio
        # Redundante con `flutter test`, pero se nombra aparte porque es el
        # principio II: `lib/dominio/` no puede importar Flutter ni Firebase.
        # Si falla, conviene verlo sin buscar entre setecientas pruebas.
        run: flutter test test/dominio/arquitectura_test.dart

      - name: Huella de los documentos normativos
        # Si un documento normativo cambió sin subir la versión del manifiesto,
        # los planes aprobados quedan sellados con una versión que ya no
        # describe lo que se les aplicó (FR-026).
        run: dart run tool/verificar_metodologia.dart

      - name: Compilar para web
        run: flutter build web --release

  reglas:
    name: Reglas de acceso de Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - uses: actions/setup-java@v4
        # El emulador de Firestore corre sobre la JVM.
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci
        working-directory: firebase

      - name: Instalar la CLI de Firebase
        # Va pinneada y fuera de package.json a propósito: como dependencia de
        # desarrollo añadía once avisos de seguridad al grafo del repositorio, y
        # aquí solo se necesita para levantar los emuladores.
        run: npm install -g firebase-tools@15.29.0

      - name: Pruebas de reglas, con sus casos negativos
        # Niegan por omisión: un plan aprobado o publicado es inmutable, y nadie
        # lee datos de un nadador sin permiso. Es el principio III.
        run: npm test
        working-directory: firebase
